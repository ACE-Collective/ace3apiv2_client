# configuration for openapi-python-client (https://github.com/openapi-generators/openapi-python-client)
# controls how the aceapi_v2_client package is generated from the vendored openapi.json
# see scripts/regenerate.sh for how this is invoked
package_name_override: aceapi_v2_client
project_name_override: aceapi-v2-client
# keep generated package metadata in sync with the hand-authored pyproject.toml
package_version_override: 2.6.0

# the generator only understands application/json, application/octet-stream and
# text/*; any other response type makes it drop the success response entirely,
# leaving sync() returning None on a perfectly good download. mapping the binary
# types onto octet-stream makes those operations return the raw bytes. ndjson is
# mapped the same way: it is not one json document, so there is nothing for the
# generator to parse it into.
content_type_overrides:
  application/zip: application/octet-stream
  application/x-ndjson: application/octet-stream
  message/rfc822: application/octet-stream
  image/*: application/octet-stream
